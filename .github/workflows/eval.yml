name: Evaluation

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the actual editable package
        run: |
          python -m pip install -e '.[dev]'
          python -m pip check
          decomposion --version
          decomposion doctor
      - name: Validate cases and experiment manifest
        run: |
          python -m eval_harness.cli --golden-dir golden
          decomposion check-suite
          planning-eval check
          planning-eval selftest
      - name: Run deterministic and offline Git integration tests
        run: python -m pytest --junitxml=test-results.xml
      - name: Run fixture-only baseline matrix
        run: python -m eval_harness.matrix_cli --golden-dir golden --output eval-report.md
      - name: Build and independently install wheel
        run: |
          python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/wheels"
          python -m venv "$RUNNER_TEMP/wheel-check"
          "$RUNNER_TEMP/wheel-check/bin/python" -m pip install "$RUNNER_TEMP"/wheels/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-check/bin/decomposion" --version
          "$RUNNER_TEMP/wheel-check/bin/planning-eval" check
          "$RUNNER_TEMP/wheel-check/bin/planning-eval" selftest
          "$RUNNER_TEMP/wheel-check/bin/python" -c "import eval_harness.matrix, decomposion_lab.core, planning_eval.experiment"
      - name: Publish fixture summary
        if: ${{ always() }}
        run: |
          if [ -f eval-report.md ]; then cat eval-report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Preserve diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evaluation-python-${{ matrix.python }}
          path: |
            test-results.xml
            eval-report.md
          if-no-files-found: warn
          retention-days: 14

  real-target-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Bootstrap documented environment
        run: python scripts/bootstrap_lab.py
      - name: Prepare real pinned source without running it
        run: |
          .venv/bin/decomposion lab init --workspace "$RUNNER_TEMP/open-webui-lab" --profile smoke
          .venv/bin/decomposion lab start --workspace "$RUNNER_TEMP/open-webui-lab" \
            --run P01-plain-r01 --agent codex --agent-version fixture-not-invoked \
            --model fixture-not-invoked --thinking fixed --execution-environment cloud
          .venv/bin/decomposion lab status --workspace "$RUNNER_TEMP/open-webui-lab"
      - name: Verify reference evidence and prepare bounded experiment
        run: |
          .venv/bin/planning-eval prepare --repo "$RUNNER_TEMP/open-webui-lab/target" --out "$RUNNER_TEMP/planning-packet.json"
          .venv/bin/planning-eval run --packet "$RUNNER_TEMP/planning-packet.json" \
            --config experiments/planning-model.example.json --out "$RUNNER_TEMP/not-executed" --max-calls 21
          test ! -d "$RUNNER_TEMP/not-executed"
      - name: Explain scope
        run: echo 'Real source/blob/range verification and experiment dry run passed. No target code or model was executed.' >> "$GITHUB_STEP_SUMMARY"
