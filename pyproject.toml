[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "decomposion-eval"
version = "0.2.0.dev0"
description = "Provider-free experiment lab and evaluation harness for Decomposion"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
decomposion = "decomposion_lab.cli:main"
planning-eval = "planning_eval.cli:main"

[tool.setuptools.packages.find]
include = ["eval_harness*", "decomposion_lab*", "planning_eval*"]
exclude = ["tests*", "golden*", "experiments*"]

[tool.setuptools.package-data]
planning_eval = ["VERSION"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
