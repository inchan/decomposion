[project]
name = "decomposion-eval"
version = "0.1.0"
description = "Evaluation harness for Decomposion golden-set reasoning tests"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
